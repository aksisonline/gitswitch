name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no code changed'
        type: boolean
        default: false
      force_bump:
        description: 'Override the auto-detected bump (use when markers were lost, e.g. to a squash merge)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

jobs:
  check:
    name: Check for code changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if internal/ or cmd/ changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v -- '-' | head -n1)
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          if [ -z "$LATEST_TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Force release requested"
            exit 0
          fi

          # Contingency: if the latest tag has no GitHub release (GoReleaser
          # previously failed after the tag was pushed), always rebuild.
          if ! gh release view "$LATEST_TAG" --repo aksisonline/gitswitch > /dev/null 2>&1; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag $LATEST_TAG exists but has no release — rebuilding"
            exit 0
          fi

          CHANGED=$(git diff "$LATEST_TAG"..HEAD --name-only -- internal/ cmd/ .goreleaser.yaml || true)
          if [ -z "$CHANGED" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes since $LATEST_TAG"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  skip:
    name: No code changes detected
    needs: check
    if: needs.check.outputs.should_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only docs/config changed. No release needed."

  version:
    name: Compute next version
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.next_version.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next_version
        run: |
          # Latest stable tag (no pre-release suffix)
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname | grep -v '\-' | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest stable tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          FORCE_BUMP="${{ github.event.inputs.force_bump }}"
          if [ -n "$FORCE_BUMP" ] && [ "$FORCE_BUMP" != "auto" ]; then
            BUMP="$FORCE_BUMP"
            echo "Bump level forced via workflow_dispatch: $BUMP"
          else
            # Bump level = highest [minor]/[major] marker on any commit since the
            # last stable tag. Squash-merged PR commits end in " (#123)" after the
            # marker, so allow that optional suffix. Note: a squash merge is not a
            # descendant of the commits it squashed, so if the squash commit's own
            # subject dropped the marker, it's unrecoverable here — use force_bump.
            COMMITS_SINCE=$(git log "${LATEST}..HEAD" --format=%s)
            if echo "$COMMITS_SINCE" | grep -qE '\[major\]( \(#[0-9]+\))?$'; then
              BUMP="major"
            elif echo "$COMMITS_SINCE" | grep -qE '\[minor\]( \(#[0-9]+\))?$'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "Bump level since $LATEST: $BUMP"
          fi

          case "$BUMP" in
            major) NEW_TAG="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
            *) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "New tag: $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

  release:
    name: Build and release
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BASE="gitswitch-${{ matrix.goos }}-${{ matrix.goarch }}"
          OUTPUT="${BASE}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ needs.version.outputs.new_tag }}" -o "$OUTPUT" ./cmd/gitswitch
          sha256sum "$OUTPUT" > "${BASE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitswitch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gitswitch-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            gitswitch-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  publish:
    name: Create release and tag
    needs: [check, version, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "gitswitch-*" -o -name "*.sha256" \) -exec mv {} release/ \;
          cd release
          cat gitswitch-*.sha256 > checksums.txt 2>/dev/null || echo "No checksums"
          ls -la

      - name: Include install scripts
        run: |
          cp .github/install.ps1 release/install.ps1
          cp .github/install.cmd release/install.cmd

      - name: Update install script with version
        run: |
          sed -i 's|VERSION="${1:-v[^"]*}"|VERSION="${1:-${{ needs.version.outputs.new_tag }}}"|' .github/install.sh

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.new_tag }}"
          git push origin "${{ needs.version.outputs.new_tag }}"

      - name: Prepare release notes
        run: |
          NEW_TAG="${{ needs.version.outputs.new_tag }}"
          PREV_TAG="${{ needs.check.outputs.latest_tag }}"
          DATE="$(date -u +%Y-%m-%d)"

          # CHANGELOG.md accumulates every past version too — only the
          # [Unreleased] section is this release's notes. Extract just that.
          awk -v tag="$NEW_TAG" -v date="$DATE" '
            /^## \[Unreleased\]/ { flag=1; print "## " tag " — " date; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "" >> /tmp/release-notes.md
            echo "**Full Changelog**: https://github.com/aksisonline/gitswitch/compare/${PREV_TAG}...${NEW_TAG}" >> /tmp/release-notes.md
          fi

          mkdir -p /tmp/gs-skill
          cp cmd/gitswitch/skill/SKILL.md /tmp/gs-skill/
          zip -j /tmp/gitswitch.skill /tmp/gs-skill/SKILL.md

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.new_tag }}

      - name: Delete tag on GoReleaser failure
        if: failure() && steps.goreleaser.outcome == 'failure'
        run: |
          git push origin --delete "${{ needs.version.outputs.new_tag }}" || true
          git tag -d "${{ needs.version.outputs.new_tag }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload skill artifact to release
        run: |
          gh release upload "${{ needs.version.outputs.new_tag }}" /tmp/gitswitch.skill --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-website:
    name: Rebuild gitswitch.dev
    needs: [version, release]
    runs-on: ubuntu-latest
    if: success()
    continue-on-error: true

    steps:
      - name: Trigger website rebuild
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aksisonline/gitswitch-web-v3/dispatches \
            -d '{"event_type":"gitswitch-release","client_payload":{"version":"${{ needs.version.outputs.new_tag }}"}}'

  notify-website-manual:
    name: Rebuild gitswitch.dev (manual)
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && needs.check.outputs.should_release == 'false'
    continue-on-error: true

    steps:
      - name: Trigger website rebuild with latest tag
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aksisonline/gitswitch-web-v3/dispatches \
            -d '{"event_type":"gitswitch-release","client_payload":{"version":"${{ needs.check.outputs.latest_tag }}"}}'
