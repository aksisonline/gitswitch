name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no code changed'
        type: boolean
        default: false
      force_bump:
        description: 'Override the auto-detected bump (use when markers were lost, e.g. to a squash merge)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check for code changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if internal/ or cmd/ changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v -- '-' | head -n1)
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          if [ -z "$LATEST_TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Force release requested"
            exit 0
          fi

          # Contingency: if the latest tag has no GitHub release (GoReleaser
          # previously failed after the tag was pushed), always rebuild.
          if ! gh release view "$LATEST_TAG" --repo aksisonline/gitswitch > /dev/null 2>&1; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag $LATEST_TAG exists but has no release — rebuilding"
            exit 0
          fi

          CHANGED=$(git diff "$LATEST_TAG"..HEAD --name-only -- internal/ cmd/ .goreleaser.yaml || true)
          if [ -z "$CHANGED" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes since $LATEST_TAG"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  skip:
    name: No code changes detected
    needs: check
    if: needs.check.outputs.should_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only docs/config changed. No release needed."

  version:
    name: Compute next version
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.next_version.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next_version
        run: |
          # Latest stable tag (no pre-release suffix)
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname | grep -v '\-' | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest stable tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          FORCE_BUMP="${{ github.event.inputs.force_bump }}"
          if [ -n "$FORCE_BUMP" ] && [ "$FORCE_BUMP" != "auto" ]; then
            BUMP="$FORCE_BUMP"
            echo "Bump level forced via workflow_dispatch: $BUMP"
          else
            # Bump level = highest [minor]/[major] marker on any commit since the
            # last stable tag. Squash-merged PR commits end in " (#123)" after the
            # marker, so allow that optional suffix. Note: a squash merge is not a
            # descendant of the commits it squashed, so if the squash commit's own
            # subject dropped the marker, it's unrecoverable here — use force_bump.
            COMMITS_SINCE=$(git log "${LATEST}..HEAD" --format=%s)
            if echo "$COMMITS_SINCE" | grep -qE '\[major\]( \(#[0-9]+\))?$'; then
              BUMP="major"
            elif echo "$COMMITS_SINCE" | grep -qE '\[minor\]( \(#[0-9]+\))?$'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "Bump level since $LATEST: $BUMP"
          fi

          case "$BUMP" in
            major) NEW_TAG="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
            *) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "New tag: $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Create release and tag
    needs: [check, version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.new_tag }}"
          git push origin "${{ needs.version.outputs.new_tag }}"

      - name: Prepare release notes
        run: |
          NEW_TAG="${{ needs.version.outputs.new_tag }}"
          PREV_TAG="${{ needs.check.outputs.latest_tag }}"
          DATE="$(date -u +%Y-%m-%d)"

          # CHANGELOG.md accumulates every past version too — only the
          # [Unreleased] section is this release's notes. Extract just that.
          awk -v tag="$NEW_TAG" -v date="$DATE" '
            /^## \[Unreleased\]/ { flag=1; print "## " tag " — " date; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "" >> /tmp/release-notes.md
            echo "**Full Changelog**: https://github.com/aksisonline/gitswitch/compare/${PREV_TAG}...${NEW_TAG}" >> /tmp/release-notes.md
          fi

          mkdir -p /tmp/gs-skill
          cp skills/gitswitch/SKILL.md /tmp/gs-skill/
          zip -j /tmp/gitswitch.skill /tmp/gs-skill/SKILL.md

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.new_tag }}

      - name: Delete tag on GoReleaser failure
        if: failure() && steps.goreleaser.outcome == 'failure'
        run: |
          git push origin --delete "${{ needs.version.outputs.new_tag }}" || true
          git tag -d "${{ needs.version.outputs.new_tag }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload skill artifact to release
        run: |
          gh release upload "${{ needs.version.outputs.new_tag }}" /tmp/gitswitch.skill --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cut CHANGELOG.md's Unreleased section into this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ needs.version.outputs.new_tag }}"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/cut-changelog-${NEW_TAG}"

          # Move [Unreleased]'s content under a permanent version header and
          # leave a clean, empty [Unreleased] behind for the next release.
          # Previously this was a manual follow-up commit — it's easy to
          # forget (it sat un-cut through this whole release cycle once).
          perl -0777 -pi -e "s/## \[Unreleased\]/## [Unreleased]\n\n## [$NEW_TAG] — $DATE/" CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to cut, skipping."
            exit 0
          fi

          # main requires a PR for every change — a direct push here gets
          # rejected (GH006), so open one instead and let it auto-merge once
          # approved, rather than trying to bypass branch protection.
          #
          # -B/-f make branch creation and push idempotent across reruns
          # (e.g. a retried job after a transient failure hitting an
          # already-existing branch). The gh calls are best-effort and
          # non-fatal (warn, don't fail the job) — a rerun where the PR
          # already exists, or auto-merge being unavailable, shouldn't take
          # down `publish` and block `sync-canary` the way the direct push
          # used to; worst case someone has to open/merge the PR by hand.
          git checkout -B "$BRANCH"
          git commit -m "docs: cut ${NEW_TAG} release notes"
          git push -f origin "$BRANCH"

          if ! gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: cut ${NEW_TAG} release notes" \
              --body "Automated: moves \`[Unreleased]\` into a permanent \`## [${NEW_TAG}] — ${DATE}\` header now that ${NEW_TAG} has shipped. Approve to merge — it's set to auto-merge once approved." \
              || echo "::warning::Could not open the changelog-cut PR for ${NEW_TAG} — cut CHANGELOG.md by hand via a PR into main."
          fi
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::Could not enable auto-merge on the changelog-cut PR for ${NEW_TAG} — merge it manually."

  sync-canary:
    name: Fast-forward canary with this release
    needs: [version, publish]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout canary
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canary

      - name: Merge main into canary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # canary must carry every stable release forward — otherwise its next
          # beta would build on top of stale code while claiming a version
          # number ahead of what's actually stable. If this conflicts, don't
          # guess: fail loudly so it gets resolved with a real PR from main.
          if git merge --no-edit origin/main -m "chore: merge main (${{ needs.version.outputs.new_tag }}) into canary"; then
            git push origin canary
            echo "✓ canary now carries ${{ needs.version.outputs.new_tag }}"
          else
            git merge --abort
            echo "::error::Merging main into canary after ${{ needs.version.outputs.new_tag }} produced conflicts — resolve manually with a PR from main into canary, then re-run the canary workflow."
            exit 1
          fi

  notify-website:
    name: Rebuild gitswitch.dev
    needs: [check, version, publish]
    runs-on: ubuntu-latest
    # Two cases collapsed into one job: a real release just published, or a
    # manual dispatch with nothing to release (still worth a rebuild, e.g.
    # to pick up a docs-only change). version/publish are skipped (not
    # failed) in the second case, so always() + an explicit result check is
    # needed — a plain if: success() would skip this job in that case too.
    if: always() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.check.outputs.should_release == 'false'))
    continue-on-error: true

    steps:
      - name: Trigger website rebuild
        run: |
          VERSION="${{ needs.check.outputs.should_release == 'true' && needs.version.outputs.new_tag || needs.check.outputs.latest_tag }}"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aksisonline/gitswitch-web-v3/dispatches \
            -d "{\"event_type\":\"gitswitch-release\",\"client_payload\":{\"version\":\"$VERSION\"}}"
